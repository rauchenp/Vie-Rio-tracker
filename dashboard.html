<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vie → Rio Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --accent:#38bdf8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:16px; line-height:1.45; }
    h1 { font-size:1.4rem; margin-bottom:4px; }
    .sub { color:#94a3b8; font-size:0.85rem; margin-bottom:14px; }
    .btn {
      display:block; width:100%; background:#22c55e; color:#052e16;
      text-align:center; padding:13px; border-radius:12px; font-weight:700;
      text-decoration:none; margin-bottom:18px;
    }
    .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card h2 { font-size:1rem; color:var(--accent); margin-bottom:12px; }
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    th, td { padding:8px 5px; text-align:left; border-bottom:1px solid #334155; }
    th { color:#94a3b8; font-weight:600; }
    .best { color:#4ade80; font-weight:700; }
    .up { color:#f87171; }
    .down { color:#4ade80; }
    .same { color:#94a3b8; }
    .trend { font-weight:700; margin-left:4px; }
    details { background:var(--card); border-radius:14px; margin-bottom:14px; }
    summary {
      padding:13px 16px; cursor:pointer; font-weight:600; color:#fb923c;
      list-style:none; display:flex; justify-content:space-between;
    }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"▼"; font-size:0.7rem; color:#94a3b8; }
    details[open] summary::after { content:"▲"; }
    .details-content { padding:0 16px 14px; }
    #status { font-size:0.8rem; color:#94a3b8; margin-bottom:10px; }
    footer { text-align:center; margin-top:20px; color:#64748b; font-size:0.75rem; }
    canvas { max-height:240px; }
  </style>
</head>
<body>
  <h1>✈️ Wien → Rio</h1>
  <p class="sub">Hinflug Fr 23.10.2026 · Update alle 4 h</p>

  <a class="btn" href="https://github.com/rauchenp/Vie-Rio-tracker/actions/workflows/track.yml" target="_blank">
    🔄 Jetzt Preise aktualisieren
  </a>

  <div id="status">Lade Preise…</div>

  <div class="card">
    <h2>Economy – aktuell</h2>
    <canvas id="chartEco"></canvas>
  </div>

  <div class="card">
    <h2>Economy-Preise + Trend</h2>
    <table>
      <thead>
        <tr><th>Person</th><th>Rück</th><th>Preis</th><th>Trend</th></tr>
      </thead>
      <tbody id="ecoTable"></tbody>
    </table>
  </div>

  <details>
    <summary>Premium Economy & Business (Vergleich)</summary>
    <div class="details-content">
      <canvas id="chartPrem" style="margin:10px 0 14px;"></canvas>
      <table>
        <thead>
          <tr><th>Person</th><th>Rück</th><th>Prem.Eco</th><th>Business</th></tr>
        </thead>
        <tbody id="premTable"></tbody>
      </table>
    </div>
  </details>

  <footer>Daten live aus prices.csv · Seite neu laden nach manuellem Lauf</footer>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/rauchenp/Vie-Rio-tracker/main/prices.csv?" + Date.now();

    function parseCSV(text) {
      const lines = text.trim().split("\n").slice(1);
      const entries = [];

      for (const line of lines) {
        // Suche nach Label + Preis am Ende der relevanten Felder
        // Beispiel: ...1P | Rück 2026-10-31 | economy,1,2026-10-31,economy,1530,...
        const m = line.match(/(1P|2P)\s*\|\s*Rück\s*(2026-\d{2}-\d{2})\s*\|\s*(economy|premium-economy|business).*?,(\d{3,5}),/);
        if (m) {
          // Timestamp am Anfang der Zeile
          const tsMatch = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
          entries.push({
            ts: tsMatch ? tsMatch[1] : "",
            persons: m[1] === "1P" ? 1 : 2,
            returnDate: m[2],
            cabin: m[3],
            price: parseInt(m[4], 10)
          });
        }
      }
      return entries;
    }

    function getLatestAndPrev(entries, persons, returnDate, cabin) {
      const filtered = entries
        .filter(e => e.persons === persons && e.returnDate === returnDate && e.cabin === cabin)
        .sort((a,b) => b.ts.localeCompare(a.ts));
      return { latest: filtered[0] || null, prev: filtered[1] || null };
    }

    function trendHtml(latest, prev) {
      if (!latest) return '<span class="same">–</span>';
      if (!prev) return '<span class="same">neu</span>';
      const diff = latest.price - prev.price;
      if (diff > 0) return `<span class="up trend">↑ +${diff} €</span>`;
      if (diff < 0) return `<span class="down trend">↓ ${diff} €</span>`;
      return `<span class="same trend">→ 0 €</span>`;
    }

    async function load() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const entries = parseCSV(text);

        if (entries.length === 0) {
          document.getElementById("status").textContent = "Keine gültigen Preise gefunden.";
          return;
        }

        const lastTs = entries.map(e => e.ts).filter(Boolean).sort().pop() || "unbekannt";
        document.getElementById("status").textContent = "Letzter Stand: " + lastTs + " UTC · " + entries.length + " Einträge";

        const combos = [
          { persons:1, ret:"2026-10-31", label:"Bettina", short:"31.10." },
          { persons:1, ret:"2026-11-01", label:"Bettina", short:"01.11." },
          { persons:2, ret:"2026-11-02", label:"Amelie + David", short:"02.11." },
          { persons:2, ret:"2026-11-03", label:"Amelie + David", short:"03.11." },
        ];

        // Economy
        const ecoPrices = [];
        const ecoLabels = [];
        let ecoHtml = "";

        combos.forEach(c => {
          const { latest, prev } = getLatestAndPrev(entries, c.persons, c.ret, "economy");
          const price = latest ? latest.price : null;
          const isBest = (c.persons===1 && c.ret==="2026-11-01") || (c.persons===2 && c.ret==="2026-11-02");
          ecoHtml += `<tr>
            <td>${c.label}</td>
            <td>${c.short}</td>
            <td class="${isBest && price ? 'best' : ''}">${price ? price.toLocaleString('de-DE') + " €" : "–"}</td>
            <td>${trendHtml(latest, prev)}</td>
          </tr>`;
          ecoLabels.push(c.label.split(" ")[0] + "\n" + c.short);
          ecoPrices.push(price || 0);
        });
        document.getElementById("ecoTable").innerHTML = ecoHtml;

        if (typeof Chart !== "undefined") {
          new Chart(document.getElementById("chartEco"), {
            type: "bar",
            data: {
              labels: ecoLabels,
              datasets: [{ data: ecoPrices, backgroundColor: ["#4ade80","#22c55e","#4ade80","#86efac"] }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, ticks: { color: "#94a3b8" }, grid: { color: "#334155" } },
                x: { ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { display: false } }
              }
            }
          });
        }

        // Premium + Business
        let premHtml = "";
        const premData = [], bizData = [];
        combos.forEach(c => {
          const prem = getLatestAndPrev(entries, c.persons, c.ret, "premium-economy");
          const biz  = getLatestAndPrev(entries, c.persons, c.ret, "business");
          premHtml += `<tr>
            <td>${c.label}</td>
            <td>${c.short}</td>
            <td>${prem.latest ? prem.latest.price.toLocaleString('de-DE') + " €" : "–"} ${trendHtml(prem.latest, prem.prev)}</td>
            <td>${biz.latest ? biz.latest.price.toLocaleString('de-DE') + " €" : "–"} ${trendHtml(biz.latest, biz.prev)}</td>
          </tr>`;
          premData.push(prem.latest ? prem.latest.price : 0);
          bizData.push(biz.latest ? biz.latest.price : 0);
        });
        document.getElementById("premTable").innerHTML = premHtml;

        if (typeof Chart !== "undefined") {
          new Chart(document.getElementById("chartPrem"), {
            type: "bar",
            data: {
              labels: ["B 31.10.","B 01.11.","A+D 02.11.","A+D 03.11."],
              datasets: [
                { label: "Premium Eco", data: premData, backgroundColor: "#fb923c" },
                { label: "Business", data: bizData, backgroundColor: "#c084fc" }
              ]
            },
            options: {
              responsive: true,
              plugins: { legend: { labels: { color: "#94a3b8" } } },
              scales: {
                y: { beginAtZero: true, ticks: { color: "#94a3b8" }, grid: { color: "#334155" } },
                x: { ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { display: false } }
              }
            }
          });
        }

      } catch (err) {
        document.getElementById("status").textContent = "Fehler beim Laden: " + err.message;
        console.error(err);
      }
    }

    // Warte kurz, bis Chart.js geladen ist
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", load);
    } else {
      setTimeout(load, 100);
    }
  </script>
</body>
</html>
