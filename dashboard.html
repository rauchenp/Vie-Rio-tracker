<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vie → Rio Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --accent:#38bdf8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:16px; line-height:1.45; }
    h1 { font-size:1.4rem; margin-bottom:4px; }
    .sub { color:#94a3b8; font-size:0.85rem; margin-bottom:10px; }
    .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card h2 { font-size:1rem; color:var(--accent); margin-bottom:12px; }
    table { width:100%; border-collapse:collapse; font-size:0.88rem; }
    th, td { padding:9px 6px; text-align:left; border-bottom:1px solid #334155; }
    th { color:#94a3b8; font-weight:600; }
    .best { color:#4ade80; font-weight:700; }
    .up { color:#f87171; font-weight:700; }
    .down { color:#4ade80; font-weight:700; }
    .same { color:#94a3b8; }
    details { background:var(--card); border-radius:14px; margin-bottom:14px; }
    summary {
      padding:13px 16px; cursor:pointer; font-weight:600; color:#fb923c;
      list-style:none; display:flex; justify-content:space-between;
    }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"▼"; font-size:0.7rem; color:#94a3b8; }
    details[open] summary::after { content:"▲"; }
    .details-content { padding:0 16px 14px; }
    #status { font-size:0.8rem; color:#94a3b8; margin-bottom:12px; }
    #chartNote { font-size:0.8rem; color:#94a3b8; margin-top:8px; }
    footer { text-align:center; margin-top:20px; color:#64748b; font-size:0.75rem; }
    canvas { width:100% !important; max-height:280px; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
    <div>
      <h1>✈️ Wien → Rio</h1>
      <p class="sub">Hinflug Fr 23.10.2026 · Update alle 4 h</p>
    </div>
    <a href="https://github.com/rauchenp/Vie-Rio-tracker/actions/workflows/track.yml" 
       target="_blank"
       title="Preise aktualisieren"
       style="
         display:inline-block;
         width:34px;
         height:34px;
         background:#1e293b;
         border:1px solid #334155;
         border-radius:8px;
         text-align:center;
         line-height:32px;
         text-decoration:none;
         font-size:16px;
         color:#94a3b8;
         flex-shrink:0;
       ">🔄</a>
  </div>

  <div id="status">Lade Preise…</div>

  <div class="card">
    <h2>Preisentwicklung (Economy)</h2>
    <canvas id="chartWeek" height="200"></canvas>
    <div id="chartNote"></div>
  </div>

  <div class="card">
    <h2>Economy – Preise + Trend</h2>
    <table>
      <thead>
        <tr>
          <th>Person</th>
          <th>Rückflug</th>
          <th>Preis</th>
          <th>Trend</th>
        </tr>
      </thead>
      <tbody id="ecoTable"></tbody>
    </table>
  </div>

  <details>
    <summary>Premium Economy & Business (Vergleich)</summary>
    <div class="details-content">
      <table>
        <thead>
          <tr>
            <th>Person</th>
            <th>Rückflug</th>
            <th>Premium Eco</th>
            <th>Business</th>
          </tr>
        </thead>
        <tbody id="premTable"></tbody>
      </table>
    </div>
  </details>

  <footer>Daten live aus prices.csv · Seite neu laden nach manuellem Lauf</footer>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/rauchenp/Vie-Rio-tracker/main/prices.csv?" + Date.now();

    function parseCSV(text) {
      const lines = text.trim().split("\n").slice(1);
      const entries = [];
      for (const line of lines) {
        const m = line.match(/(1P|2P)\s*\|\s*Rück\s+(2026-\d{2}-\d{2})\s*\|\s*(economy|premium-economy|business),(\d+),2026-\d{2}-\d{2},\3,(\d{3,5})/);
        if (m) {
          const tsMatch = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
          entries.push({
            ts: tsMatch ? tsMatch[1] : "",
            persons: m[1] === "1P" ? 1 : 2,
            returnDate: m[2],
            cabin: m[3],
            price: parseInt(m[5], 10)
          });
        }
      }
      return entries;
    }

    function getLatestAndPrev(entries, persons, returnDate, cabin) {
      const filtered = entries
        .filter(e => e.persons === persons && e.returnDate === returnDate && e.cabin === cabin)
        .sort((a,b) => b.ts.localeCompare(a.ts));
      return { latest: filtered[0] || null, prev: filtered[1] || null };
    }

    function trendHtml(latest, prev) {
      if (!latest) return '<span class="same">–</span>';
      if (!prev) return '<span class="same">neu</span>';
      const diff = latest.price - prev.price;
      if (diff > 0) return `<span class="up">↑ +${diff} €</span>`;
      if (diff < 0) return `<span class="down">↓ ${diff} €</span>`;
      return `<span class="same">→ 0 €</span>`;
    }

    function buildSeries(entries, persons, returnDate, cabin) {
      return entries
        .filter(e => e.persons === persons && e.returnDate === returnDate && e.cabin === cabin && e.ts)
        .sort((a,b) => a.ts.localeCompare(b.ts))
        .map(e => ({
          label: e.ts.slice(5, 16),
          price: e.price
        }));
    }

    async function load() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const entries = parseCSV(text);

        document.getElementById("status").textContent =
          entries.length === 0
            ? "Keine gültigen Preise gefunden."
            : "Letzter Stand: " + (entries.map(e => e.ts).filter(Boolean).sort().pop() || "?") + " UTC · " + entries.length + " Einträge";

        const combos = [
          { persons:1, ret:"2026-10-31", label:"Bettina", short:"31.10." },
          { persons:1, ret:"2026-11-01", label:"Bettina", short:"01.11." },
          { persons:2, ret:"2026-11-02", label:"Amelie + David", short:"02.11." },
          { persons:2, ret:"2026-11-03", label:"Amelie + David", short:"03.11." },
        ];

        // Economy Tabelle
        let ecoHtml = "";
        combos.forEach(c => {
          const { latest, prev } = getLatestAndPrev(entries, c.persons, c.ret, "economy");
          const price = latest ? latest.price : null;
          const isBest = (c.persons===1 && c.ret==="2026-11-01") || (c.persons===2 && c.ret==="2026-11-02");
          ecoHtml += `<tr>
            <td>${c.label}</td>
            <td>${c.short}</td>
            <td class="${isBest && price ? 'best' : ''}">${price ? price.toLocaleString('de-DE') + " €" : "–"}</td>
            <td>${trendHtml(latest, prev)}</td>
          </tr>`;
        });
        document.getElementById("ecoTable").innerHTML = ecoHtml;

        // Premium + Business
        let premHtml = "";
        combos.forEach(c => {
          const prem = getLatestAndPrev(entries, c.persons, c.ret, "premium-economy");
          const biz  = getLatestAndPrev(entries, c.persons, c.ret, "business");
          premHtml += `<tr>
            <td>${c.label}</td>
            <td>${c.short}</td>
            <td>${prem.latest ? prem.latest.price.toLocaleString('de-DE') + " €" : "–"} ${trendHtml(prem.latest, prem.prev)}</td>
            <td>${biz.latest ? biz.latest.price.toLocaleString('de-DE') + " €" : "–"} ${trendHtml(biz.latest, biz.prev)}</td>
          </tr>`;
        });
        document.getElementById("premTable").innerHTML = premHtml;

        // Trendlinie
        function drawLine() {
          if (!window.Chart) {
            document.getElementById("chartNote").textContent = "Chart konnte nicht geladen werden.";
            return;
          }

          const s1 = buildSeries(entries, 1, "2026-11-01", "economy");
          const s2 = buildSeries(entries, 2, "2026-11-02", "economy");
          const allLabels = [...new Set([...s1.map(x => x.label), ...s2.map(x => x.label)])].sort();

          function align(series) {
            return allLabels.map(l => {
              const found = series.find(x => x.label === l);
              return found ? found.price : null;
            });
          }

          if (allLabels.length < 2) {
            document.getElementById("chartNote").textContent = "Noch zu wenig Verlaufsdaten für eine Linie.";
            return;
          }

          new Chart(document.getElementById("chartWeek"), {
            type: "line",
            data: {
              labels: allLabels,
              datasets: [
                {
                  label: "Bettina 01.11.",
                  data: align(s1),
                  borderColor: "#22c55e",
                  tension: 0.25,
                  spanGaps: true,
                  pointRadius: 4,
                  fill: false
                },
                {
                  label: "Amelie + David 02.11.",
                  data: align(s2),
                  borderColor: "#38bdf8",
                  tension: 0.25,
                  spanGaps: true,
                  pointRadius: 4,
                  fill: false
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { labels: { color: "#94a3b8", boxWidth: 12 } }
              },
              scales: {
                y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } },
                x: { ticks: { color: "#94a3b8", maxRotation: 45, font: { size: 10 } }, grid: { display: false } }
              }
            }
          });
        }

        if (window.Chart) {
          drawLine();
        } else {
          let tries = 0;
          const t = setInterval(() => {
            tries++;
            if (window.Chart || tries > 25) {
              clearInterval(t);
              drawLine();
            }
          }, 150);
        }

      } catch (err) {
        document.getElementById("status").textContent = "Fehler: " + err.message;
      }
    }

    load();
  </script>
</body>
</html>
